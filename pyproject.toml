[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-platform"
version = "0.3.0"
description = "Synthetic data engineering and privacy evaluation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "sdv>=1.38,<2.0",
    "faker>=37,<38",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.16,<1.0",
    "rich>=14.0,<15.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0", 
    "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
]

[project.scripts]
sdp = "synthetic_data.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]